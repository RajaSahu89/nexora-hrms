# Render Blueprint: one web service (API + website) and one PostgreSQL database.
services:
  - type: web
    name: nexora-hrms
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build:web
    startCommand: sh -c 'if [ -d prisma/migrations ]; then npx prisma migrate deploy; else npx prisma db push; fi && npm start'
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: nexora-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: CLIENT_URL
        sync: false
databases:
  - name: nexora-db
    plan: free
